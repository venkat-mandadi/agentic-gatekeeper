[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-gatekeeper"
version = "0.1.0"
description = "Audit GKE resources against OPA/Gatekeeper policies and preview the impact of new ones."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Venkat Mandadi" }]
keywords = ["opa", "gatekeeper", "gator", "policy-as-code", "kubernetes", "gke", "sre", "mcp"]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
mcp = ["mcp>=1.2.0"]
dev = ["pytest>=8.0", "ruff==0.15.11"]

[project.scripts]
gatekeeper-check = "gatekeeper_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
